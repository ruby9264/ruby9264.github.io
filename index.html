    <script>
      // Runs before first paint: no flash of the wrong palette, and the
      // tokens are correct for anything that measures them on mount.
      // Mirrors the logic in src/hooks/useSettings.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem('r-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B1524' : '#E8EDE0')

          var settings = JSON.parse(localStorage.getItem('r-settings') || '{}')
          if (settings.motion === 'reduced' || settings.motion === 'full') {
            document.documentElement.setAttribute('data-motion', settings.motion)
          }
        } catch (e) {
          /* private mode — React sets it on mount instead */
        }
      })()
    </script>
